name: Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  docs:
    name: Docs accuracy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check docs against the codebase
        run: npm run check:docs

  lint:
    name: Lint (clean directories)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint the directories under lint control
        run: npm run check:lint

      - name: Check support id prefixes are derived
        run: npm run check:support-prefixes

  cargo-locks:
    name: Cargo lockfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The engine depends on plugins/lumen by path, so resolution
          # fails without the submodules for reasons unrelated to the locks.
          submodules: recursive

      - name: Install the pinned Rust toolchain
        # Same cargo as rust-toolchain.toml, minus the macOS targets it
        # lists: resolving a lockfile needs neither.
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"

      - name: Check every Cargo.lock matches its manifest
        # `cargo update --workspace` only touches entries the manifests no
        # longer match, so without --locked it is also the minimal fix.
        run: |
          fail=0
          for lock in $(git ls-files '*Cargo.lock'); do
            m="${lock%.lock}.toml"
            if ! err=$(cargo update --workspace --locked --manifest-path "$m" 2>&1 >/dev/null); then
              if grep -q -- '--locked was passed' <<<"$err"; then
                echo "::error file=$lock,title=Cargo.lock out of date::Run: cargo update --workspace --manifest-path $m"
              else
                echo "::error file=$lock,title=Cargo.lock could not be resolved::$(grep -m1 '^error' <<<"$err")"
              fi
              fail=1
            fi
          done
          exit $fail
