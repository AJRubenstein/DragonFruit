name: Update Windows runtime

on:
  schedule:
    # GitHub schedules run from the default branch: install this workflow on main.
    - cron: "43 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-windows-runtime
  cancel-in-progress: false

jobs:
  update:
    name: Verify runtime and propose pin update
    if: >-
      github.repository == 'Open-Resin-Alliance/DragonFruit' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout development runtime pin
        uses: actions/checkout@v7
        with:
          ref: dev
          persist-credentials: false

      - name: Discover and verify a newer Microsoft runtime
        shell: powershell
        run: |
          ./scripts/test-windows-runtime-policy.ps1
          ./scripts/update-windows-runtime.ps1

      # GITHUB_TOKEN-created PRs do not trigger pull_request workflows. Verify
      # the exact resulting pin before creating the PR, under PowerShell 7 too.
      - name: Verify pinned Microsoft installer and prerequisite generation
        id: runtime
        shell: pwsh
        run: |
          ./scripts/update-windows-runtime.ps1 -Check
          ./scripts/prepare-windows-runtime.ps1
          $manifest = Get-Content scripts/windows-runtime.json -Raw | ConvertFrom-Json
          "version=$($manifest.version)" >> $env:GITHUB_OUTPUT

      - name: Create or update runtime pull request
        # v8.1.1, pinned because this action receives repository write access.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ github.token }}
          base: dev
          branch: automation/windows-vc-runtime
          add-paths: scripts/windows-runtime.json
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: "chore: update Windows VC++ runtime to ${{ steps.runtime.outputs.version }}"
          title: "chore: update Windows VC++ runtime to ${{ steps.runtime.outputs.version }}"
          body: |
            ## Summary

            Update the external x64 Microsoft VC++ prerequisite pin to ${{ steps.runtime.outputs.version }}.
            Only the minimum runtime version, immutable Microsoft download URL, and SHA-256 pin change. No Microsoft DLL or installer is bundled, and no app version or release is created.

            ## Validation notes

            [The updater run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) verified the Microsoft installer Authenticode signature, SHA-256, and runtime version before proposing this change. Pinned-download validation and prerequisite metadata generation also passed. Discovery used Windows PowerShell 5.1; pinned validation used PowerShell 7. The downloaded Microsoft installer was not executed or published as an artifact.

            This PR uses `GITHUB_TOKEN`, so GitHub does not automatically trigger the usual push or pull-request checks. Review the linked updater run; a maintainer can manually run **Validate Windows runtime** on `automation/windows-vc-runtime` for another pinned-runtime check. That manual run does not replace any other required PR checks; close and reopen this PR as a maintainer to trigger those checks before merging.

            This workflow does not merge the PR or publish a release.
